# ── Development Environment Inventory ──────────────────────────────────
# VPN subnet: 10.10.0.0/24  (WireGuard wg0)
# All hosts are only reachable after VPN tunnel is established.

all:
  vars:
    ansible_user: ansible
    ansible_python_interpreter: /usr/bin/python3
    environment: dev
  children:
    dev_servers:
      children:
        dev_web:
          hosts:
            dev-web-01:
              ansible_host: 10.10.0.11
            dev-web-02:
              ansible_host: 10.10.0.12
        dev_db:
          hosts:
            dev-db-01:
              ansible_host: 10.10.0.21
