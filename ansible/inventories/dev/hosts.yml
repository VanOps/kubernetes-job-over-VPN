---
# ══════════════════════════════════════════════════════════════════════
# Dev Inventory — VPN Lab (Docker Compose)
#
# remote-host is reachable at 10.10.20.10 ONLY via the WireGuard tunnel.
# The VPN sidecar (wg0) must be up before Ansible can reach this host.
#
# To use a different host, override ansible_host via extra-vars or by
# creating a hosts.yml in the environment-specific inventory directory.
# ══════════════════════════════════════════════════════════════════════
all:
  hosts:
    remote-dev:
      ansible_host: 10.10.20.10
      ansible_user: ansible
      ansible_port: 22
