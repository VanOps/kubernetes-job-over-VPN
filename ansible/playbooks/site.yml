---
# ══════════════════════════════════════════════════════════════════════
# Site Playbook: Main deployment entry point
# Applies common config to all hosts, then role-specific plays.
# ══════════════════════════════════════════════════════════════════════
- name: Apply common configuration to all hosts
  hosts: all
  become: true
  gather_facts: true
  vars_files:
    - ../vault/secrets.yml   # ansible-vault encrypted
  roles:
    - common

- name: Apply web server configuration
  hosts:
    - "{{ environment | default('dev') }}_web"
  become: true
  gather_facts: false
  vars_files:
    - ../vault/secrets.yml
  roles:
    - { role: common, tags: ["common"] }
  vars:
    run_type: webserver
