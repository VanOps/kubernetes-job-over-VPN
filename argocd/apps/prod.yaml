---
# ══════════════════════════════════════════════════════════════════════
# ArgoCD Application – PRODUCTION
#
# Sync policy : MANUAL ONLY (no automated block)
# Branch      : main
# Audit trail : ttlSecondsAfterFinished=86400 (24h pod retention)
# Gate        : GitHub Actions `environment: production` with required
#               reviewers + `make prod-approve` CLI confirmation
# ══════════════════════════════════════════════════════════════════════
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ansible-job-prod
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: ansible-gitops
    environment: prod
    audit: "true"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    notifications.argoproj.io/subscribe.on-sync-running.slack: devops-prod
    notifications.argoproj.io/subscribe.on-sync-failed.slack: devops-critical
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: devops-prod
    notifications.argoproj.io/subscribe.on-health-degraded.slack: devops-critical
spec:
  project: default

  source:
    repoURL: https://github.com/VanOps/kubernetes-job-over-VPN
    targetRevision: main
    path: helm/ansible-job
    helm:
      releaseName: ansible-job-prod
      valueFiles:
        - values.yaml
        - values-prod.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: ansible-jobs-prod

  # NO automated block → MANUAL sync required
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - Replace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 1 # Fail fast in prod — do not retry blindly
      backoff:
        duration: 30s
        maxDuration: 1m
        factor: 2

  ignoreDifferences:
    - group: batch
      kind: Job
      jsonPointers:
        - /spec/selector
        - /spec/template/metadata/labels/controller-uid
        - /spec/template/metadata/labels/batch.kubernetes.io/controller-uid

  # Prod sync history is retained by ArgoCD (visible in UI + argocd app history)
  # Job pods are kept 24h (ttlSecondsAfterFinished=86400) for log inspection
