---
# ══════════════════════════════════════════════════════════════════════
# VPN Lab – Standalone Compose
#
# Starts ONLY the VPN server and remote host containers.
# Use this to test VPN connectivity from Kubernetes (dev environment)
# without starting the full local stack.
#
# Architecture:
#
#   ┌─────────────────────────────────────────────────────────────┐
#   │  vpn-net  (Docker bridge, auto-assigned subnet)            │
#   │    └── vpn-server  (WireGuard UDP :51820, also on backend) │
#   │                                                             │
#   │  vpn-backend-net  (10.10.20.0/24)                          │
#   │    ├── vpn-server  (gateway/router)                        │
#   │    └── remote-host (10.10.20.10, SSH on :22)               │
#   └─────────────────────────────────────────────────────────────┘
#
#   WireGuard virtual tunnel: 10.10.99.0/24
#     Server : 10.10.99.1  (vpn-server container)
#     Client : 10.10.99.2  (K8s pod / local vpn sidecar)
#
# Prerequisites:
#   bash test/vpn-lab/setup.sh    # generate keys & configs (once)
#
# Usage:
#   # Start the lab
#   docker compose -f docker-compose.vpn-lab.yml up -d
#
#   # Check connectivity from K8s dev (NodePort or host network):
#   #   WireGuard endpoint → <HOST_IP>:51820
#   #   Remote host via VPN → 10.10.20.10:22
#
#   # Tail logs
#   docker compose -f docker-compose.vpn-lab.yml logs -f
#
#   # Stop & remove
#   docker compose -f docker-compose.vpn-lab.yml down
# ══════════════════════════════════════════════════════════════════════

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── WireGuard VPN Server ─────────────────────────────────────────
  vpn-server:
    build:
      context: ./docker/vpn-server
      target: final
    image: k8s-vpn-server-lab:local
    container_name: vpn-server
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    environment:
      - TZ=Europe/Madrid
      - WG_INTERFACE=wg0
    volumes:
      - ./test/vpn-lab/wg0-server.conf:/etc/wireguard/wg0.conf:ro
    ports:
      # Expose WireGuard UDP port on the host so K8s pods can reach it.
      # From K8s, the Endpoint in wg0.conf should be <NODE_IP>:51820.
      - "51820:51820/udp"
    networks:
      - vpn-net
      - vpn-backend-net
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging

  # ── Simulated Remote Host ────────────────────────────────────────
  # A Debian container with SSH. Only reachable at 10.10.20.10 via
  # the WireGuard tunnel — it has no interface on vpn-net.
  remote-host:
    build:
      context: ./docker/remote-host
    image: k8s-remote-host-lab:local
    container_name: remote-host
    restart: unless-stopped
    environment:
      - TZ=Europe/Madrid
    volumes:
      - ./test/secrets/ssh-public-key:/run/secrets/ssh-public-key:ro
    networks:
      vpn-backend-net:
        # Fixed IP — Ansible inventory points to this address.
        ipv4_address: 10.10.20.10
    healthcheck:
      test: ["CMD", "pgrep", "sshd"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging

networks:
  # vpn-net: vpn-server is accessible here (WireGuard UDP port exposed).
  # K8s pods connect to <HOST_IP>:51820 (mapped via ports above).
  vpn-net:
    driver: bridge

  # vpn-backend-net: isolated subnet simulating the private corporate network.
  # remote-host lives here; only reachable via VPN routing through vpn-server.
  vpn-backend-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.20.0/24
