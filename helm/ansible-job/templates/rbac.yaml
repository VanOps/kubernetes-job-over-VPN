{{- if .Values.serviceAccount.create -}}
---
# Minimal RBAC: ansible-executor only needs to read its own namespace secrets
# (when ExternalSecrets is NOT used and secrets are injected via env/volume)
# Expand this if your playbooks need K8s API access.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ansible-job.fullname" . }}-role
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ansible-job.labels" . | nindent 4 }}
rules:
  # Allow reading ConfigMaps (e.g., ansible config overrides)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  # Allow reading own Secrets (vault password, SSH key, VPN config)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames:
      - {{ .Values.ansible.vaultSecretName }}
      - {{ .Values.ansible.sshSecretName }}
      - {{ .Values.vpn.secretName }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ansible-job.fullname" . }}-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ansible-job.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ansible-job.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "ansible-job.fullname" . }}-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
