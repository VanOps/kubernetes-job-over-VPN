# ── Dev environment overrides ─────────────────────────────────────────
# Branch: develop | Auto-sync: true | Replace=true
environment: dev

vpn:
  image:
    tag: "latest"   # CI updates this to the git SHA on every develop push
  secretName: vpn-wireguard-config

ansible:
  image:
    tag: "latest"
  playbook: playbooks/test-connectivity.yml
  inventory: inventories/dev
  verbosity: 2     # verbose in dev for easier debugging
  extraEnvVars:
    - name: APP_VERSION
      value: "dev-latest"

gitSync:
  branch: develop

job:
  ttlSecondsAfterFinished: 1800    # 30min – pods auto-cleaned quickly in dev
  backoffLimit: 3
  activeDeadlineSeconds: 900       # 15min max in dev

serviceAccount:
  annotations: {}
  # Uncomment for EKS IRSA:
  # eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/ansible-executor-dev
