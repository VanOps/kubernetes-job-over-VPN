# ── Production environment overrides ─────────────────────────────────
# Branch: main | Sync: MANUAL ONLY | Audit trail: 24h pod retention
environment: prod
vpn:
  image:
    tag: "dca96a2" # CI updates on main branch push; human approves the sync
    repository: ghcr.io/vanops/k8s-vpn-sidecar
  secretName: vpn-wireguard-config
  sidecarMode: "false" # EKS 1.28: no native sidecar support; one-shot init mode
ansible:
  image:
    tag: "dca96a2"
    repository: ghcr.io/vanops/k8s-ansible-executor
  playbook: playbooks/test-connectivity.yml
  inventory: inventories/prod
  verbosity: 0 # quiet in prod – logs only errors
  extraEnvVars:
    - name: APP_VERSION
      value: "stable"
gitSync:
  enabled: false  # prod uses immutable release artifact instead of git-sync
  branch: main

# Release artifact — URL updated automatically by the "Release Ansible Package" workflow
releaseArtifact:
  enabled: true
  url: "https://github.com/vanops/kubernetes-job-over-VPN/releases/download/1.0.0/ansible-playbooks-1.0.0.tar.gz"
job:
  # ttlSecondsAfterFinished: 86400 # Disabled - Jobs will persist for full audit trail
  backoffLimit: 1 # fail fast in prod
  activeDeadlineSeconds: 3600 # 1h max
serviceAccount:
  annotations: {}
  # eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/ansible-executor-prod
resources:
  ansible:
    requests:
      cpu: 300m
      memory: 384Mi
    limits:
      cpu: 1000m
      memory: 768Mi
