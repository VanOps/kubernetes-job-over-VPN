# ── Staging environment overrides ────────────────────────────────────
# Branch: staging | Auto-sync: true (selfHeal: false) | Approval hooks
environment: staging

vpn:
  image:
    tag: "dca96a2" # CI updates on staging branch push
    pullPolicy: Always # force re-pull during dev; remove once image tag is pinned to a SHA
  secretName: vpn-wireguard-config
  sidecarMode: "false" # EKS 1.28: no native sidecar support; one-shot init mode

ansible:
  image:
    tag: "dca96a2"
  playbook: playbooks/test-connectivity.yml
  inventory: inventories/staging
  verbosity: 1
  extraEnvVars:
    - name: APP_VERSION
      value: "staging-candidate"

gitSync:
  branch: staging

job:
  # ttlSecondsAfterFinished: 7200 # Disabled - Jobs will persist for audit
  backoffLimit: 2
  activeDeadlineSeconds: 1800 # 30min

serviceAccount:
  annotations: {}
  # eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/ansible-executor-staging
