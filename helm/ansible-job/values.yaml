# ══════════════════════════════════════════════════════════════════════
# Default values for ansible-job Helm chart.
# Override per-environment in values-dev.yaml / values-staging.yaml / values-prod.yaml
# ══════════════════════════════════════════════════════════════════════

nameOverride: ""
fullnameOverride: ""

# Target environment (dev | staging | prod)
environment: dev

# ── Container Registry ────────────────────────────────────────────────
# OWNER is replaced by CI with the actual GitHub org/user
registry: ghcr.io
registryOwner: OWNER # replaced by CI: github.repository_owner

# ── VPN Sidecar (WireGuard) ───────────────────────────────────────────
vpn:
  image:
    repository: ghcr.io/vanops/k8s-vpn-sidecar
    tag: "latest" # updated by CI to git SHA on each push
    pullPolicy: IfNotPresent
  interface: wg0
  # Name of the K8s Secret containing 'wg0.conf'
  # Initial testing: create manually with kubectl
  # Production:      synced by ExternalSecrets from AWS Secrets Manager
  secretName: vpn-wireguard-config
  monitorInterval: "10" # seconds between interface health checks
  # true  → stay alive as native sidecar (K8s 1.29+ / vanilla 1.28 with feature gate)
  # false → exit after wg-quick up (plain init container, EKS 1.28 and below)
  sidecarMode: "true"

# ── Ansible Executor ──────────────────────────────────────────────────
ansible:
  image:
    repository: ghcr.io/vanops/k8s-ansible-executor
    tag: "latest" # updated by CI
    pullPolicy: IfNotPresent
  # Relative paths inside the cloned repo
  playbook: playbooks/test-connectivity.yml
  inventory: inventories/dev
  extraVars: ""
  verbosity: 0 # 0-4 (0=quiet, 4=connection debug)
  skipVpnWait: "false"
  # Name of K8s Secret with key 'vault-password'
  vaultSecretName: ansible-vault-password
  # Name of K8s Secret with key 'ssh-private-key'
  sshSecretName: ansible-ssh-key
  extraEnvVars: []
  # - name: APP_VERSION
  #   value: "1.2.3"

# ── Git Sync (clones Ansible monorepo into the Pod) ───────────────────
# Used in dev/staging. In prod, use releaseArtifact instead.
gitSync:
  enabled: true
  image:
    repository: registry.k8s.io/git-sync/git-sync
    tag: "v4.3.0"
    pullPolicy: IfNotPresent
  repo: https://github.com/VanOps/kubernetes-job-over-VPN
  branch: develop # overridden per-env
  depth: 1
  # Sub-path within the repo to expose as /ansible
  subPath: ansible
  # Mount point inside the Ansible executor container
  mountPath: /ansible

# ── Release Artifact (downloads packaged ansible/ from GitHub Release) ─
# Use in prod instead of gitSync for immutable, versioned deployments.
# Mutually exclusive with gitSync: set gitSync.enabled=false when using this.
# The tarball is produced by the "Release Ansible Package" GitHub workflow
# and attached to each tagged GitHub Release as ansible-playbooks-vX.Y.Z.tar.gz
releaseArtifact:
  enabled: false
  # Full URL to the release asset — updated automatically by the release workflow
  url: ""
  image:
    repository: alpine
    tag: "3.21"
    pullPolicy: IfNotPresent

# ── Job Configuration ─────────────────────────────────────────────────
job:
  # Kubernetes Job is managed as an ArgoCD PostSync hook:
  # - Runs AFTER ConfigMaps, Secrets, SA, RBAC are synced
  # - Jobs persist for audit and debugging (no auto-deletion)
  # ttlSecondsAfterFinished: null # Disabled - Jobs will not be auto-deleted
  backoffLimit: 2
  activeDeadlineSeconds: 1800 # 30min max; 3600 for prod
  completions: 1
  parallelism: 1
  # restartPolicy must be Never for Jobs
  restartPolicy: Never

# ── Service Account ───────────────────────────────────────────────────
serviceAccount:
  create: true
  annotations: {}
    # For EKS IRSA (AWS Secrets Manager access):
    # eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/ansible-executor-dev
  name: ""

# ── Resource Limits ───────────────────────────────────────────────────
resources:
  vpn:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  gitSync:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  ansible:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ── Security Contexts ─────────────────────────────────────────────────
securityContext:
  pod:
    runAsNonRoot: false # VPN sidecar needs NET_ADMIN (may need root-adjacent)
    fsGroup: 1000 # secret volumes are group-owned by ansible GID → 0440 readable
    seccompProfile:
      type: RuntimeDefault
  vpn:
    # NET_ADMIN: create/manage network interfaces
    # SYS_MODULE: load kernel modules (wireguard)
    capabilities:
      add: ["NET_ADMIN", "SYS_MODULE"]
      drop: ["ALL"]
    privileged: false
  ansible:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

# ── Node Scheduling ───────────────────────────────────────────────────
nodeSelector: {}
tolerations: []
affinity: {}

# ── Timezone ─────────────────────────────────────────────────────────
timezone: Europe/Madrid

# ── Image Pull Secrets ───────────────────────────────────────────────
imagePullSecrets:
  - name: ghcr-pull-secret

# ── Monitoring (optional) ────────────────────────────────────────────
monitoring:
  enabled: false
  # Adds prometheus.io/scrape annotations to the Job pod
  prometheusAnnotations: false
  # Labels for Prometheus ServiceMonitor
  labels: {}
