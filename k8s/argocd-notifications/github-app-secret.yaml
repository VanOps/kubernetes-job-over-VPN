---
# ══════════════════════════════════════════════════════════════════════
# Secret para GitHub App - ArgoCD Notifications (Opción Recomendada)
#
# Pasos para obtener los valores:
# 1. App ID: https://github.com/settings/apps → Tu app → App ID (número)
# 2. Installation ID: URL después de instalar la app en el repo
#    https://github.com/settings/installations/XXXXXX
# 3. Private Key: Generar en la página de tu GitHub App
#
# Apply:
#   kubectl apply -f k8s/argocd-notifications/github-app-secret.yaml -n argocd
#
# Ver documentación completa: docs/argocd/github-notifications.md
# ══════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
type: Opaque
stringData:
  # ID de tu GitHub App (número, ejemplo: 123456)
  github-app-id: ""

  # Installation ID (número, ejemplo: 12345678)
  github-app-installation-id: ""

  # Private Key completo (incluir header y footer)
  github-app-private-key: |
    -----BEGIN RSA PRIVATE KEY-----
    MIIEpAIBAAKCAQEAxxxx...
    (contenido completo del archivo .pem descargado)
    ...xxxxxxxxxxxxxx
    -----END RSA PRIVATE KEY-----
