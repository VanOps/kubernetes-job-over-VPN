---
# ══════════════════════════════════════════════════════════════════════
# Secret para GitHub Token - ArgoCD Notifications
#
# Crear el token en: https://github.com/settings/tokens
# Permisos requeridos: repo:status
#
# Apply:
#   kubectl apply -f k8s/argocd-notifications/github-token-secret.yaml -n argocd
# ══════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
type: Opaque
stringData:
  github-token: "" # Reemplazar con tu Personal Access Token
