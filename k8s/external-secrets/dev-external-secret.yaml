---
# ══════════════════════════════════════════════════════════════════════
# ExternalSecrets – DEV namespace
# AWS Secrets Manager paths:
#   ansible-vpn/dev/wireguard-config  → { "wg0.conf": "<content>" }
#   ansible-vpn/dev/vault-password    → { "vault-password": "<pass>" }
#   ansible-vpn/dev/ssh-key           → { "ssh-private-key": "<pem>" }
# ══════════════════════════════════════════════════════════════════════

# ── WireGuard VPN config ─────────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vpn-wireguard-config
  namespace: ansible-jobs-dev
  labels:
    app.kubernetes.io/part-of: ansible-gitops
    environment: dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: vpn-wireguard-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/part-of: ansible-gitops
          environment: dev
  data:
    - secretKey: wg0.conf
      remoteRef:
        key: ansible-vpn/dev/wireguard-config
        property: wg0.conf

---
# ── Ansible-vault password ────────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ansible-vault-password
  namespace: ansible-jobs-dev
  labels:
    app.kubernetes.io/part-of: ansible-gitops
    environment: dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: ansible-vault-password
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: vault-password
      remoteRef:
        key: ansible-vpn/dev/vault-password
        property: vault-password

---
# ── SSH private key ───────────────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ansible-ssh-key
  namespace: ansible-jobs-dev
  labels:
    app.kubernetes.io/part-of: ansible-gitops
    environment: dev
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: ansible-ssh-key
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ssh-private-key
      remoteRef:
        key: ansible-vpn/dev/ssh-key
        property: ssh-private-key
