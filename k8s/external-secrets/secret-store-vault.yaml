# ══════════════════════════════════════════════════════════════════════
# ClusterSecretStore – HashiCorp Vault (Staging)
#
# Prerequisites:
#   1. External Secrets Operator instalado:
#        helm repo add external-secrets https://charts.external-secrets.io
#        helm install external-secrets external-secrets/external-secrets \
#          -n external-secrets --create-namespace
#
#   2. KV v2 mount "ansible-vpn" en Vault con secretos en:
#        ansible-vpn/staging/wireguard-config  → { "wg0.conf": "<content>" }
#        ansible-vpn/staging/vault-password    → { "vault-password": "<pass>" }
#        ansible-vpn/staging/ssh-key           → { "ssh-private-key": "<pem>" }
#
#      Ejemplo para crear los secretos en Vault:
#        vault kv put ansible-vpn/staging/wireguard-config wg0.conf=@wg0.conf
#        vault kv put ansible-vpn/staging/vault-password vault-password=<pass>
#        vault kv put ansible-vpn/staging/ssh-key ssh-private-key=@id_rsa
#
#   3. Token de Vault con permisos de lectura sobre ansible-vpn/staging/*:
#        make k8s-secrets-vault-token VAULT_TOKEN=hvs.XXXX
# ══════════════════════════════════════════════════════════════════════
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: hashicorp-vault
  labels:
    app.kubernetes.io/part-of: ansible-gitops
    app.kubernetes.io/component: secret-store
spec:
  provider:
    vault:
      # IMPORTANT: Reemplazar con la dirección real del servidor Vault
      server: "https://VAULT_SERVER:8200"
      path: "ansible-vpn" # KV v2 mount point
      version: "v2"
      auth:
        tokenSecretRef:
          name: vault-token
          namespace: external-secrets
          key: token
