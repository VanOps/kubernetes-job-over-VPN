---
# ══════════════════════════════════════════════════════════════════════
# ClusterSecretStore – AWS Secrets Manager
#
# Prerequisites:
#   1. External Secrets Operator installed:
#        helm repo add external-secrets https://charts.external-secrets.io
#        helm install external-secrets external-secrets/external-secrets \
#          -n external-secrets --create-namespace
#
#   2. IRSA role with secretsmanager:GetSecretValue permission:
#        aws iam create-role --role-name ExternalSecretsRole \
#          --assume-role-policy-document file://trust-policy.json
#        aws iam attach-role-policy --role-name ExternalSecretsRole \
#          --policy-arn arn:aws:iam::aws:policy/SecretsManagerReadWrite
#
#   3. Service account annotated with IRSA role ARN (see below)
#
# Initial testing (skip ExternalSecrets, create secrets manually):
#   kubectl create secret generic vpn-wireguard-config \
#     --from-file=wg0.conf=./test/vpn/wg0.conf -n ansible-jobs-dev
#   kubectl create secret generic ansible-vault-password \
#     --from-literal=vault-password=YOUR_PASSWORD -n ansible-jobs-dev
#   kubectl create secret generic ansible-ssh-key \
#     --from-file=ssh-private-key=~/.ssh/ansible_rsa -n ansible-jobs-dev
# ══════════════════════════════════════════════════════════════════════
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  labels:
    app.kubernetes.io/part-of: ansible-gitops
    app.kubernetes.io/component: secret-store
spec:
  provider:
    aws:
      service: SecretsManager
      # IMPORTANT: Replace with your AWS region
      region: eu-west-1
      auth:
        # EKS IRSA authentication (recommended for EKS)
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
        # Alternative: use static credentials (NOT recommended for prod)
        # secretRef:
        #   accessKeyIDSecretRef:
        #     name: aws-credentials
        #     namespace: external-secrets
        #     key: access-key-id
        #   secretAccessKeySecretRef:
        #     name: aws-credentials
        #     namespace: external-secrets
        #     key: secret-access-key
