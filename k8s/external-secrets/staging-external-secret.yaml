---
# ExternalSecrets – STAGING namespace
# AWS Secrets Manager paths use staging prefix.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vpn-wireguard-config
  namespace: ansible-jobs-staging
  labels:
    app.kubernetes.io/part-of: ansible-gitops
    environment: staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: vpn-wireguard-config
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: wg0.conf
      remoteRef:
        key: ansible-vpn/staging/wireguard-config
        property: wg0.conf

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ansible-vault-password
  namespace: ansible-jobs-staging
  labels:
    app.kubernetes.io/part-of: ansible-gitops
    environment: staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: ansible-vault-password
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: vault-password
      remoteRef:
        key: ansible-vpn/staging/vault-password
        property: vault-password

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ansible-ssh-key
  namespace: ansible-jobs-staging
  labels:
    app.kubernetes.io/part-of: ansible-gitops
    environment: staging
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: ansible-ssh-key
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ssh-private-key
      remoteRef:
        key: ansible-vpn/staging/ssh-key
        property: ssh-private-key
