---
# ══════════════════════════════════════════════════════════════════════
# ExternalSecrets – STAGING namespace
# HashiCorp Vault KV v2 mount "ansible-vpn", paths:
#   staging/wireguard-config  → { "wg0.conf": "<content>" }
#   staging/vault-password    → { "vault-password": "<pass>" }
#   staging/ssh-key           → { "ssh-private-key": "<pem>" }
# ══════════════════════════════════════════════════════════════════════

# ── WireGuard VPN config ─────────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vpn-wireguard-config
  namespace: ansible-jobs-staging
  labels:
    app.kubernetes.io/part-of: ansible-gitops
    environment: staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hashicorp-vault
    kind: ClusterSecretStore
  target:
    name: vpn-wireguard-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/part-of: ansible-gitops
          environment: staging
  data:
    - secretKey: wg0.conf
      remoteRef:
        key: staging/wireguard-config
        property: wg0.conf

---
# ── Ansible-vault password ────────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ansible-vault-password
  namespace: ansible-jobs-staging
  labels:
    app.kubernetes.io/part-of: ansible-gitops
    environment: staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hashicorp-vault
    kind: ClusterSecretStore
  target:
    name: ansible-vault-password
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: vault-password
      remoteRef:
        key: staging/vault-password
        property: vault-password

---
# ── SSH private key ───────────────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ansible-ssh-key
  namespace: ansible-jobs-staging
  labels:
    app.kubernetes.io/part-of: ansible-gitops
    environment: staging
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: hashicorp-vault
    kind: ClusterSecretStore
  target:
    name: ansible-ssh-key
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ssh-private-key
      remoteRef:
        key: staging/ssh-key
        property: ssh-private-key
